<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster Presentation Registration - PROFSUMMIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #2C2B30 0%, #4F4F51 50%, #F58F7C 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2C2B30 0%, #4F4F51 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 5px;
            color: #F2C4CE;
        }

        .header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 15px;
            color: #D6D6D6;
        }

        .header h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #F58F7C;
        }

        .form-container {
            padding: 30px 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #2C2B30;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D6D6D6;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            outline: none;
            border-color: #F58F7C;
            box-shadow: 0 0 0 3px rgba(245, 143, 124, 0.1);
        }

        .whatsapp-section {
            background: linear-gradient(135deg, #F2C4CE 0%, #F58F7C 100%);
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            text-align: center;
        }

        .whatsapp-section h4 {
            color: #2C2B30;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 700;
        }

        .whatsapp-btn {
            background: #2C2B30;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            font-size: 1rem;
        }

        .whatsapp-btn:hover {
            background: #4F4F51;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(44, 43, 48, 0.3);
        }

        .deadline {
            background: #F2C4CE;
            border-left: 4px solid #F58F7C;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .deadline p {
            color: #2C2B30;
            font-weight: 700;
            margin: 0;
            font-size: 0.95rem;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #F58F7C 0%, #F2C4CE 100%);
            color: #2C2B30;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 143, 124, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer {
            background: #4F4F51;
            padding: 20px;
            text-align: center;
            color: #D6D6D6;
            font-size: 0.9rem;
        }

        .footer p {
            margin: 5px 0;
        }

        .footer .org {
            font-weight: 700;
            color: #F58F7C;
            font-family: 'Space Grotesk', sans-serif;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        .error-message {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                border-radius: 0;
            }

            .form-container {
                padding: 25px 20px;
            }

            .header h3 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Showcase Your Ideas</h1>
            <h2>@PROFSUMMIT</h2>
            <h3>Poster Presentation</h3>
        </div>

        <div class="form-container">
            <div class="success-message" id="successMessage">
                ✓ Registration Successful! See you at the event.
            </div>
            <div class="error-message" id="errorMessage">
                ✗ Something went wrong. Please try again.
            </div>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="college">College *</label>
                    <input type="text" id="college" name="college" required placeholder="Enter your college name">
                </div>

                <div class="form-group">
                    <label for="course">Course *</label>
                    <input type="text" id="course" name="course" required placeholder="Enter your course">
                </div>

                <div class="form-group">
                    <label for="phone">Phone *</label>
                    <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number" pattern="[0-9]{10}">
                </div>

                <div class="whatsapp-section">
                    <h4>Join Our WhatsApp Group</h4>
                    <a href="#" class="whatsapp-btn" target="_blank">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
                        </svg>
                        Join WhatsApp Group
                    </a>
                </div>

                <div class="deadline">
                    <p>⏰ Deadline: 08/10/2025 Wednesday</p>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Register Now</button>
            </form>
        </div>

        <div class="footer">
            <p class="org">Campus Syndicate • SSF Kerala</p>
            <p>© 2025 PROFSUMMIT</p>
        </div>
    </div>

    <script>
        // ⚠️ REPLACE THIS WITH YOUR DEPLOYED APPS SCRIPT WEB APP URL
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRFD40NEyPrX6KLibuD0qZuK_--8Ux1cm5NszpWAEaWtvx_C9DFIh5kaQl2mVdC6NTkA/exec';
        
        // Replace with your WhatsApp group link
        const WHATSAPP_GROUP_LINK = 'https://chat.whatsapp.com/JlBBXl9yXQsKZCNmCaXC6X';
        
        document.querySelector('.whatsapp-btn').href = WHATSAPP_GROUP_LINK;

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const errorMsg = document.getElementById('errorMessage');
            
            // Hide previous messages
            successMsg.style.display = 'none';
            errorMsg.style.display = 'none';
            
            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            
            const formData = {
                name: document.getElementById('name').value,
                college: document.getElementById('college').value,
                course: document.getElementById('course').value,
                phone: document.getElementById('phone').value,
                timestamp: new Date().toLocaleString()
            };
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });
                
                // With no-cors, we can't read the response, so we assume success
                successMsg.style.display = 'block';
                document.getElementById('registrationForm').reset();
                
                // Scroll to success message
                successMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
                
            } catch (error) {
                console.error('Error:', error);
                errorMsg.style.display = 'block';
                errorMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register Now';
            }
        });
    </script>
</body>
</html>
